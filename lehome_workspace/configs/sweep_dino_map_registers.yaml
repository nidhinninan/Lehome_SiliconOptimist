dataset:
  repo_id: repo_dp
  root: /root/data/lehome_workspace/lehome-challenge/Datasets/example/top_long_merged
  # Requires system FFmpeg + working torchcodec on the VM (see Artifacts/Vision-Backbone/sweep/dino_sweep_video_backends_*).
  # If decode fails, override once with: --dataset.video_backend=pyav
  video_backend: torchcodec
  image_transforms:
    # Linked to --dataset.image_transforms.enable in run_2run_dino_sweep.sh / run_2run_dino_sweep_no-gdrive.sh
    enable: false

policy:
  type: dino_diffusion
  vision_backbone: facebook/dinov2-with-registers-small
  spatial_pooling: map
  map_num_queries: 8
  use_registers: true
  num_register_tokens: 4
  device: cuda
  push_to_hub: false
  # MAP+registers profile: mixed precision reduces VRAM / memory traffic (verify loss on VM).
  use_amp: true

  crop_shape: null
  crop_is_random: false

  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 480, 640]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: /root/data/lehome_workspace/outputs/sweep_10k/DINOv2_MAP_Registers
job_name: DINOv2_MAP_Registers
# Profile: batch 8, map_num_queries 8 (policy). Sweep scripts also pass --num_workers=12 (matches below).
batch_size: 8
num_workers: 12
steps: 10000
save_freq: 10000
log_freq: 500

# Eval settings chosen for monitoring learning progress while staying GPU-friendly:
# - eval_freq=20000 gives signal points without hitting the 10k OOM boundary
# - n_episodes=4 + batch_size=2 is light enough for the heavy DINOv2+MAP model
# - Do full 50-episode eval separately after training with parallel_eval.sh
eval_freq: 20000
eval:
  n_episodes: 4
  batch_size: 2
  use_async_envs: false

wandb:
  enable: true
  project: lehome_challenge
